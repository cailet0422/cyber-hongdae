<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>사이버 홍대입구</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23e3192a'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3E4%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/build/three.module.js",
      "three/addons/": "/vendor/three/examples/jsm/",
      "three-mesh-bvh": "/vendor/bvh/build/index.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <!-- 입장 화면 -->
  <section id="entry" class="overlay">
    <div class="entry-card">
      <div class="brand"><span class="lotte">LOTTE CINEMA</span><span class="hongdae">홍대입구 10F</span></div>
      <h1 id="serverName">사이버 홍대입구</h1>
      <p class="sub" id="serverInfo">서버 정보를 불러오는 중…</p>
      <h2>캐릭터 선택</h2>
      <div id="charPick" class="char-pick"></div>
      <div id="pwRow" class="pw-row hidden">
        <input id="pwInput" type="password" placeholder="입장 비밀번호" autocomplete="off">
      </div>
      <button id="enterBtn" class="btn primary big" disabled>입장하기</button>
      <p class="hint">닉네임은 입장할 때마다 <b>케이온 캐릭터 이름 + 숫자</b>로 무작위 지정됩니다.</p>
      <p class="err" id="entryErr"></p>
    </div>
  </section>

  <!-- 로딩 -->
  <section id="loading" class="overlay hidden">
    <div class="loading-box">
      <div class="spinner"></div>
      <p id="loadingText">영화관으로 가는 중…</p>
      <div class="bar"><div id="loadingBar"></div></div>
    </div>
  </section>

  <!-- 강퇴/거부 -->
  <section id="kicked" class="overlay hidden">
    <div class="entry-card small">
      <h1>연결이 종료되었습니다</h1>
      <p id="kickedReason"></p>
      <button class="btn primary" onclick="location.reload()">다시 접속</button>
    </div>
  </section>

  <!-- 게임 HUD -->
  <div id="hud" class="hidden">
    <div id="topbar">
      <div class="me"><span id="myDot" class="dot"></span><b id="myNick"></b></div>
      <div id="nowPlaying" class="now"></div>
      <div class="online"><span id="onlineCount">0</span>명 접속중</div>
    </div>

    <div id="prompt" class="prompt hidden"></div>
    <div id="toast" class="toast hidden"></div>
    <div id="crosshair" class="hidden"></div>

    <!-- 채팅 -->
    <div id="chat">
      <div id="chatLog"></div>
      <form id="chatForm" autocomplete="off">
        <input id="chatInput" maxlength="200" placeholder="Enter로 채팅…">
      </form>
    </div>

    <!-- 오른쪽 하단 액션 -->
    <div id="actions">
      <button class="act" id="btnEmote" title="이모트 (G)">💃<span>이모트</span></button>
      <button class="act" id="btnStick" title="응원봉 (F)">🔦<span>응원봉</span></button>
      <button class="act" id="btnView" title="시점 (V)">🎥<span>시점</span></button>
      <button class="act" id="btnSettings" title="설정 (ESC)">⚙️<span>설정</span></button>
    </div>

    <div id="stickBar" class="panel hidden">
      <div class="stick-colors" id="stickColors"></div>
      <button class="btn small" id="stickWave">흔들기 (X)</button>
      <button class="btn small" id="stickOff">넣기 (F)</button>
    </div>

    <div id="emotePanel" class="panel hidden">
      <h3>이모트 <small>(이동하면 취소)</small></h3>
      <div id="emoteList" class="emote-list"></div>
    </div>

    <div id="settings" class="panel modal hidden">
      <h3>설정</h3>
      <label>캐릭터</label>
      <div id="charPick2" class="char-pick compact"></div>
      <label>영화 볼륨 <span id="volVal"></span></label>
      <input type="range" id="volume" min="0" max="1" step="0.01">
      <label>로비 전광판 볼륨 <span id="lvolVal"></span></label>
      <input type="range" id="lobbyVolume" min="0" max="1" step="0.01">
      <label>자막 크기 <span id="subVal"></span></label>
      <input type="range" id="subSize" min="0.6" max="1.8" step="0.05">
      <label>마우스 감도</label>
      <input type="range" id="sens" min="0.3" max="2.5" step="0.05">
      <label>그래픽 품질</label>
      <div class="seg" id="quality">
        <button data-q="low">낮음</button><button data-q="mid">보통</button><button data-q="high">높음</button>
      </div>
      <label>최대 표시 인원 <span id="maxAvVal"></span></label>
      <input type="range" id="maxAvatars" min="5" max="150" step="5">
      <div class="checks">
        <label><input type="checkbox" id="showNames"> 닉네임 표시</label>
        <label><input type="checkbox" id="showBubbles"> 말풍선 표시</label>
        <label><input type="checkbox" id="showSubs"> 자막 표시</label>
      </div>
      <div class="keys">
        <b>조작</b> WASD 이동 · Shift 달리기 · Space 점프 · 마우스 드래그 시점 · 휠 줌<br>
        E 착석/일어나기 · F 응원봉 · C 응원봉 색 · X 흔들기 · G 이모트 · V 1/3인칭 · Enter 채팅
      </div>
      <button class="btn primary" id="closeSettings">닫기</button>
    </div>

    <!-- 모바일 조이스틱 -->
    <div id="joy" class="hidden"><div id="joyKnob"></div></div>
    <button id="mobileUse" class="hidden">E</button>
    <div id="unmute" class="hidden">🔇 화면을 클릭하면 소리가 켜집니다</div>
  </div>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
